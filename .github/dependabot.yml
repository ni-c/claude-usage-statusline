version: 2
updates:
  # The actions the workflows use, and the one image the fuzzer builds in.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze are separate dependencies to Dependabot. Ungrouped, one of
      # them bumps first and the version mismatch fails the codeql job.
      codeql:
        patterns:
          - github/codeql-action*
      # build_fuzzers and run_fuzzers are the same story: they share a tag and a job.
      clusterfuzzlite:
        patterns:
          - google/clusterfuzzlite/*

  # Exists so the digest-pinned base image of the fuzzer gets refreshed at all.
  # It follows the v1 tag, which oss-fuzz moves; only the digest changes.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
